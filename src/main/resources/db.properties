# ============================================================
# AyeshaMart - database configuration (single location)
# H2 runs as a persistent TCP server (server mode).
#
# Every value can be overridden by environment variables so the
# database location stays configurable on Railway (Phase 9):
#   AYESHAMART_DB_URL
#   AYESHAMART_DB_USER
#   AYESHAMART_DB_PASSWORD
#   H2_TCP_PORT
# ============================================================
db.driver=org.h2.Driver
db.url=jdbc:h2:tcp://localhost:9092/~/AyeshaMart/data/ayeshamart
db.username=sa
db.password=
db.pool.size=10
db.h2.tcp.port=9092
db.h2.tcp.allowOthers=true